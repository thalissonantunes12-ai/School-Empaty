<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Escola em Paz - Sala de Aula</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Ajuste para renderizar e centralizar as novas imagens mantendo a essência Pixel Art */
        .sprite-image {
            width: 32px;
            height: 48px;
            object-fit: contain;
            image-rendering: pixelated;
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="classroom">
            <!-- Cenário e Elementos de Preenchimento -->
            <div class="door" style="left: 100px; top: 10px;"></div>
            <div class="window" style="left: 250px; top: 10px;"></div>
            <div class="window" style="left: 450px; top: 10px;"></div>
            <div class="board" style="left: 680px; top: 20px;"></div>
            <div class="board-materials" style="left: 693px; top: 40px;">
                <div class="board-item board-book"></div>
                <div class="board-item board-pencil"></div>
                <div class="board-item board-caderno"></div>
            </div>
            
            <!-- Decorações Extras para Preencher a Sala -->
            <div class="decoration plant" style="left: 30px; top: 110px;"></div>
            <div class="decoration bookshelf" style="left: 780px; top: 110px;"></div>
            <div class="decoration trash" style="left: 30px; top: 480px;"></div>
            <div class="trash-can" style="left: 760px; top: 445px;"></div>

            <!-- Carteiras Escolares com Materiais Embutidos -->
            <div class="desk mat-caderno" style="left: 110px; top: 150px;"></div>
            <div class="desk mat-livros" style="left: 110px; top: 270px;"></div>
            <div class="desk mat-estojo" style="left: 110px; top: 390px;"></div>

            <div class="desk mat-estojo" style="left: 260px; top: 150px;"></div>
            <div class="desk mat-caderno" style="left: 260px; top: 270px;"></div>
            <div class="desk mat-livros" style="left: 260px; top: 390px;"></div>

            <div class="desk mat-livros" style="left: 420px; top: 150px;"></div>
            <div class="desk mat-estojo" style="left: 420px; top: 270px;"></div>
            <div class="desk mat-caderno" style="left: 420px; top: 390px;"></div>

            <div class="desk mat-caderno" style="left: 580px; top: 150px;"></div>
            <div class="desk mat-livros" style="left: 580px; top: 270px;"></div>
            <div class="desk mat-estojo" style="left: 580px; top: 390px;"></div>

            <!-- Alunos (NPCs) configurados diretamente com os seus novos arquivos PNG modulares -->
            <div class="npc" id="npc1" style="left: 115px; top: 412px;">
                <img src="Lucas.png" class="sprite-image" alt="Lucas">
                <div class="speech-bubble hidden">Estou chateado...</div>
                <div class="npc-name">Lucas</div>
            </div>

            <div class="npc" id="npc2" style="left: 265px; top: 292px;">
                <img src="Mariana.png" class="sprite-image" alt="Mariana">
                <div class="speech-bubble hidden">Que raiva!</div>
                <div class="npc-name">Mariana</div>
            </div>

            <div class="npc" id="npc3" style="left: 425px; top: 292px;">
                <img src="carlos.png" class="sprite-image" alt="Carlos">
                <div class="speech-bubble hidden">Não aguento mais!</div>
                <div class="npc-name">Carlos</div>
            </div>

            <div class="npc" id="npc4" style="left: 585px; top: 172px;">
                <img src="Julia.png" class="sprite-image" alt="Júlia">
                <div class="speech-bubble hidden">O que houve?!</div>
                <div class="npc-name">Júlia</div>
            </div>

            <div class="npc" id="npc5" style="left: 265px; top: 172px;">
                <img src="Pedro.png" class="sprite-image" alt="Pedro">
                <div class="speech-bubble hidden">Que vergonha...</div>
                <div class="npc-name">Pedro</div>
            </div>
            
            <!-- Professor (Jogador Principal controlado por analógico) -->
            <div id="player" class="character">
                <!-- Se quiser mudar a arte do professor para uma imagem, troque a linha abaixo pelo seu arquivo PNG -->
                <img src="professor.png" class="sprite-image" alt="Professor">
            </div>
        </div>

        <!-- Cursor Analógico Fixo Inferior Esquerdo -->
        <div id="joystick-container">
            <div id="joystick-base">
                <div id="joystick-stick"></div>
            </div>
        </div>

        <!-- Prompt de Interação clicável -->
        <div id="interaction-prompt">Clique aqui ou aperte <span class="key">E</span> para conversar</div>
        <div id="score-board">Conflitos na Sala: <span id="solved-count">0</span>/5</div>

        <div id="dialog-box" class="hidden">
            <h3 id="dialog-title">Conflito</h3>
            <p id="dialog-text">Situação...</p>
            <div id="options-container"></div>
            <p id="feedback-text" class="hidden"></p>
            <button id="close-dialog-btn" class="hidden">Continuar</button>
        </div>

        <div id="win-screen" class="hidden">
            <h2>🏫 Sala em Paz!</h2>
            <p>Parabéns! Você resolveu todos os conflitos da sala usando a Comunicação Não Violenta.</p>
            <button id="restart-btn">Jogar Novamente</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
